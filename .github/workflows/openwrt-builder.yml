#
# File: .github/workflows/openwrt-builder.yml
# Description: 构建 NRadio C8（WT9104 / C8-688）固件
#
# 本 workflow 的骨架演化自 P3TERX/Actions-OpenWrt（MIT，Copyright (c) 2019-2024 P3TERX），
# 内容已按本机重写；出处说明见仓库 LICENSE 与 README「来源与致谢」。
#
name: OpenWrt Builder

on:
  # 手动触发即可：构建 pin 到 immortalwrt 发行 tag，上游分支头变化不代表需要重编，
  # 所以不挂 repository_dispatch（原先由 update-checker 投递，该 workflow 已移除）。
  workflow_dispatch:

# 上传 Release 需 contents:write；Mattraks/delete-workflow-runs 需 actions:write。
# 不显式声明就依赖仓库默认 token 权限（新仓库/收紧策略后为只读，届时才在末尾步骤报错）。
permissions:
  contents: write
  actions: write

# 同一时间只跑一轮：Release tag 是“分钟”精度（date +%Y.%m.%d-%H%M），并发会抢同一个 tag，
# 也白烧 Actions 额度。
concurrency:
  group: openwrt-builder
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  # 可复现：pin 到 immortalwrt 发行 tag（openwrt-25.12 分支的发行点）
  BUILD_BRANCH: v25.12.2
  CONFIG_FILE: .config
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  EMAIL: johnny@nexwy.me
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-24.04      # 2026-10-03 从 22.04 升；依赖/源路径已由 env-probe 双跑核对，回滚只需改回 22.04（RFC §5.1.5）
    # 不写就是 6h 上限；失败重跑场景会白烧额度（RFC §5.1 对额度敏感）
    timeout-minutes: 300

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        # Release 说明要列出「自上一个 tag 以来的提交」，需要完整历史与 tag。
        # 本仓库很小，全量克隆的代价可以忽略。
        fetch-depth: 0

    - name: Restore ccache
      uses: actions/cache@v5
      with:
        # actions/cache 的条目不可变：key 固定 => 命中后不再写回，ccache 自首次保存起
        # 就停止增长。加 run_id 让每轮都能写回，命中交给 restore-keys 前缀
        # （优先精确 .config，再退化到分支级）。
        path: /home/runner/.ccache
        key: ccache-${{ env.BUILD_BRANCH }}-${{ hashFiles('.config') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ env.BUILD_BRANCH }}-${{ hashFiles('.config') }}-
          ccache-${{ env.BUILD_BRANCH }}-

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # ---- 1. 腾空间：镜像自带、构建用不到的大件 ----
        # 末尾几个在 24.04 镜像里本就不存在，`rm -rf` 对不存在的路径容错，不用分支判断。
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                    /usr/local/share/boost /opt/az /opt/microsoft /usr/share/swift
        # daemon 未起时非 0；GH runner 默认 `bash -e`，不兜底会中断整步
        sudo docker image prune --all --force || true

        # ---- 2. 只删第三方 apt 源，不碰 Ubuntu 自己的 ----
        # 22.04 主源在 /etc/apt/sources.list；24.04 改成 deb822，主源在
        # /etc/apt/sources.list.d/ubuntu.sources —— 整目录删会把主源删掉，apt 全挂。
        sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete || true

        # ---- 3. 安装宿主依赖（清单单一来源：.github/apt-deps.txt）----
        # 解析：去掉 `#` 注释、按空白切成词，允许行内注释与分组排版。
        DEPS=$(sed 's/#.*//' "$GITHUB_WORKSPACE/.github/apt-deps.txt" | tr -s '[:space:]' '\n' | grep -vE '^$' | tr '\n' ' ')
        echo "apt 依赖清单：$(echo $DEPS | wc -w) 个包"
        sudo -E apt-get -qq update -o Acquire::Retries=3
        # --no-upgrade：不顺手升级 runner 上已有的包（少下载、少变量）
        sudo -E apt-get -qq install -y --no-upgrade -o Acquire::Retries=3 $DEPS
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        # ---- 4. 时区与工作目录 ----
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git config --global user.name $GITHUB_ACTOR
        git config --global user.email $EMAIL
        git clone $REPO_URL openwrt
        cd openwrt
        git checkout $BUILD_BRANCH
        echo "immortalwrt commit: $(git rev-parse HEAD)"
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Restore download cache (dl)
      uses: actions/cache@v5
      with:
        # 必须用真实路径：$GITHUB_WORKSPACE/openwrt 是指向 /workdir/openwrt 的软链，
        # tar 不跟随软链，缓存到的只会是链接本身。
        # 每轮 make download 都要重下 GB 级源码，这是编译之外最大的固定开销。
        path: /workdir/openwrt/dl
        key: dl-${{ env.BUILD_BRANCH }}-${{ hashFiles('.config') }}-${{ github.run_id }}
        restore-keys: |
          dl-${{ env.BUILD_BRANCH }}-${{ hashFiles('.config') }}-
          dl-${{ env.BUILD_BRANCH }}-

    - name: Load custom feeds (extra packages / local feed)
      run: |
        # 说明：原先这里调用的 diy-part1.sh 已内联到本步骤（2026-10-03）。
        #       必须在 `feeds update` **之前** 执行：feeds.conf 要先就位。
        #       仓库根目录从此不再有 diy-part*.sh；按需保留的独立脚本统一放 scripts/。
        # 可选：仓库根放 feeds.conf.default 可覆盖上游定义（当前仓库没有）。
        # 原写法 `[ -e $FEEDS_CONF ] && mv $FEEDS_CONF ...` 在变量缺失/为空时，`mv`
        # 只剩一个参数会报错并让整步失败 —— 改成显式判空 + 文件存在才动。
        if [ -f feeds.conf.default ]; then
          mv feeds.conf.default openwrt/feeds.conf.default
          echo "已用仓库根的 feeds.conf.default 覆盖上游定义"
        fi
        cd openwrt
        echo "openwrt tree : $(pwd)"

        # ---- 1. 单包仓库（不是 feed，必须直接放进 package/）----
        # 注意：上游旧脚本写的是 `cd #GITHUB_WORKSPACE/package`（路径被注释掉了），
        #       实际 cd 到 $HOME，导致 argon 主题从未被真正编进固件。这里修正。
        for repo in \
            "https://github.com/jerrykuku/luci-theme-argon.git luci-theme-argon" \
            "https://github.com/jerrykuku/luci-app-argon-config.git luci-app-argon-config" ; do
          set -- $repo
          url="$1"; dir="$2"
          if [ ! -d "package/$dir" ]; then
            git clone --depth 1 "$url" "package/$dir"
          fi
        done

        # ---- 2. 本仓库自带的本地包：做成 src-link feed ----
        # 结构：packages/<category>/<pkg>（feed 的标准布局：分类目录/包目录）
        # 为什么不用 `cp -r packages/* openwrt/package/`：实测直接拷进 package/ 时，
        # make defconfig 不会给它们生成 config 符号（tmp/.config-package.in 里根本没有
        # config PACKAGE_luci-app-*，而且连一条 build-dependency 警告都没有）——
        # 像是包压根没进扫描范围。改走 feeds 机制（所有 feed 包都这样装）最稳。
        if [ -d "$GITHUB_WORKSPACE/packages" ]; then
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
          if ! grep -q '^src-link nrlocal ' feeds.conf; then
            echo "src-link nrlocal $GITHUB_WORKSPACE/packages" >> feeds.conf
          fi
          echo "已注册本地 feed: nrlocal -> $GITHUB_WORKSPACE/packages"
          grep -n nrlocal feeds.conf
        fi

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration (files / .config / patches / local packages)
      run: |
        # 说明：原先这里调用的 diy-part2.sh 已内联到本步骤（2026-10-03），
        #       逻辑逐行等价，只是不再需要 chmod +x 和跨文件跳转。
        #       默认 LAN IP / 主机名 / 时区统一交给 files/etc/uci-defaults/99-nradio-c8-defaults，
        #       所以不需要在本步骤 sed config_generate。
        OPENWRT="$GITHUB_WORKSPACE/openwrt"
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config

        # ---- 1. 应用机型补丁（NRadio C8 / WT9104）----
        # 补丁是 git 可 diff 的文本（见 docs/RFC-nradio-c8-native-firmware.md §5.2）。
        # git apply 失败必须立即中断：不允许带着“半个补丁”往下跑 2.5 小时。
        for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
          [ -e "$p" ] || continue
          echo "applying $(basename "$p")"
          git -C "$OPENWRT" apply --verbose "$p"
        done
        echo "--- 已应用补丁后的改动（预期只在 target/linux/mediatek 下）---"
        git -C "$OPENWRT" diff --stat

        # ---- 2. 确认本地包真的就位（早点报错，别等 2.5 小时）----
        # diy-part1.sh 用 `src-link nrlocal $GITHUB_WORKSPACE/packages` 注册了 feed，
        # feeds install 之后包应出现在 package/feeds/nrlocal/<name>（通常是指回
        # $GITHUB_WORKSPACE/packages/<category>/<name> 的软链）。
        for p in "$GITHUB_WORKSPACE"/packages/*/*/; do
          [ -d "$p" ] || continue
          name=$(basename "$p")
          found=""
          for cand in "$OPENWRT/package/feeds/nrlocal/$name" "$OPENWRT/package/$name"; do
            [ -f "$cand/Makefile" ] && found=$cand && break
          done
          if [ -z "$found" ]; then
            echo "错误：本地包 $name 没出现在 openwrt/package/{feeds/nrlocal/,} 下" >&2
            ls -la "$OPENWRT/package/feeds/" 2>/dev/null | head >&2
            exit 1
          fi
          echo "local package ok: $name -> ${found#$OPENWRT/}"
        done

        # ---- 3. 清包元数据 / 包目录缓存 ----
        # .packagedirs 是「包目录文件列表」缓存；如果它是在本地包拷进来之前生成的，
        # 扫描阶段就永远看不到我们的包（连一个警告都没有，症状就是 config 符号缺失）。
        # 本地包是在上面 Update/Install feeds 阶段才进包的，本步骤紧接其后，
        # 缓存很可能仍是 feeds 更新前那份 —— 所以这一步不能省。
        # （实测踩过：luci-app-wtmodem / luci-app-cellscan 被 defconfig 静默丢掉。）
        rm -f "$OPENWRT/tmp/.packageinfo" "$OPENWRT/tmp/.config-package.in" \
              "$OPENWRT/tmp/.targetinfo" "$OPENWRT/tmp/.config-target.in" \
              "$OPENWRT/tmp/.packagedirs" "$OPENWRT/tmp/.packagedirs.tmp" \
              "$OPENWRT/tmp/.targetdirs" "$OPENWRT/tmp/.targetinfo.tmp"
        echo "已清理 tmp/ 包元数据与包目录缓存（下次 make defconfig 会重新扫描）"

        # ---- 4. files/ 卫生 ----
        # `mv files openwrt/files` 会把目录里**所有**文件（含 .gitignore 掉的）一起带进
        # rootfs。本地调试留下的 python 缓存会因此混进固件，清掉（纯增重，无用处）。
        if [ -d "$OPENWRT/files" ]; then
          n=$(find "$OPENWRT/files" -name '__pycache__' -type d -print 2>/dev/null | wc -l)
          # *.pyc 只数 __pycache__ 之外的（目录内的跟着目录一起没了，别重复计数）
          n=$((n + $(find "$OPENWRT/files" -name '*.pyc' -type f -not -path '*/__pycache__/*' -print 2>/dev/null | wc -l)))
          if [ "$n" -gt 0 ]; then
            find "$OPENWRT/files" -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
            find "$OPENWRT/files" -name '*.pyc' -type f -delete 2>/dev/null || true
            echo "已清掉 files/ 下 $n 项 python 缓存（__pycache__/*.pyc）"
          fi
        fi

    - name: Pre-build environment check
      run: |
        echo "--- 编译前磁盘与 ccache（留档，便于事后判断 no space 与缓存命中）---"
        df -hT / /workdir || true
        ccache -s || true

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        # ---- 诊断：本地包安装位置与符号注册情况 ----
        echo "==== 诊断 ===="
        echo "--- 本地包安装位置（nrlocal feed）---"
        ls -d package/feeds/nrlocal/*/ 2>/dev/null | head -5 || true
        echo "--- Kconfig 里是否注册了符号（0 = 没注册）---"
        for p in luci-app-wtmodem luci-app-cellscan fanctl ledctl; do
          n=$(grep -c "config PACKAGE_$p$" tmp/.config-package.in 2>/dev/null || true)
          echo "  $p: ${n:-0}"
        done
        echo "==== 诊断结束 ===="
        # 快速失败：确认本仓库自带的本地包真的被 defconfig 选中了。
        # 否则要等 2.5 小时才在编译末尾报“找不到包/依赖缺失”，代价太大。
        # 后半段是 fanctl/ledctl 的 DEPENDS：它们被选中就证明包内依赖声明真的生效了。
        missing=0
        for p in luci-app-wtmodem luci-app-cellscan luci-compat luci-lua-runtime luci-lib-nixio \
                 fanctl ledctl \
                 kmod-hwmon-pwmfan kmod-gpio-pwm kmod-leds-gpio kmod-ledtrig-network; do
          if grep -q "^CONFIG_PACKAGE_$p=y" .config; then
            echo "  OK   CONFIG_PACKAGE_$p=y"
          else
            echo "::error::CONFIG_PACKAGE_$p 未被选中（本地包没拷进 package/？依赖缺失？）"
            grep -n "$p" .config | head -5 || true
            missing=1
          fi
        done
        [ "$missing" = 0 ] || exit 1
        grep -E '^CONFIG_TARGET.*DEVICE.*=y' .config
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        grep -q '^CONFIG_CCACHE=y' .config && echo "ccache enabled: $(ccache -s | head -3)"
        # 快速失败：原写法 `|| make -j1 || make -j1 V=s` 会在并行失败后再串行续跑，多数
        # 情况下跑不完；且撞 timeout 时算 cancelled（failure() 不触发），连日志都留不下。
        # pipefail 只在子 shell 里生效（不动本步其他命令），保证 tee 不吞掉 make 的退出码。
        # 日志写到工作区真实路径：openwrt 是软链，artifact 上传不跟软链。
        if ( set -o pipefail; make -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/build.log" ); then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "::error::编译失败，详见 build-log artifact；不会上传/发布产物"
          exit 1
        fi
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: build-log${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: build.log
        if-no-files-found: ignore

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v6
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v6
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag and notes
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        set -euo pipefail
        TAG="$(date +'%Y.%m.%d-%H%M')"
        echo "release_tag=$TAG" >> $GITHUB_OUTPUT

        # 上一个 release = 离 HEAD 最近的可达 tag（checkout 用了 fetch-depth: 0）。
        # 没有 tag 时（新仓库首轮）走首建分支。
        PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
        PKGS="$(grep -c '^CONFIG_PACKAGE_.*=y' openwrt/.config 2>/dev/null || echo '?')"

        {
          echo "NRadio C8（WT9104 / C8-688）固件，基于 ImmortalWrt \`$BUILD_BRANCH\` 构建。"
          echo
          echo "## 本次变更"
          echo
          if [ -n "$PREV" ]; then
            echo "自上一版 \`$PREV\` 以来 $GITHUB_REPOSITORY 的提交："
            echo
            COMMITS="$(git log --no-merges --pretty='- %s (`%h`)' "$PREV"..HEAD)"
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
            else
              echo "（与上一版相比无代码变更，本次为重新构建）"
            fi
          else
            echo "首次构建，暂无上一版可比。最近提交："
            echo
            git log --no-merges -n 20 --pretty='- %s (`%h`)'
          fi
          echo
          echo "## 构建信息"
          echo
          echo "| 项 | 值 |"
          echo "|---|---|"
          echo "| 设备 | NRadio C8（WT9104 / C8-688），\`nradio,c8-668gl\` |"
          echo "| 源码 | [immortalwrt]($REPO_URL) @ \`$BUILD_BRANCH\` |"
          echo "| 配置 | \`.config\` @ \`${GITHUB_SHA:0:8}\`（$PKGS 项包配置） |"
          echo "| 构建 | \`$ImageOS\` / \`$RUNNER_ARCH\` |"
          echo "| 时间 | $(date -u +'%Y-%m-%d %H:%M UTC') |"
          echo
          echo "## 产物校验"
          echo
          echo '```'
          (cd "$FIRMWARE" && sha256sum ./*) || true
          echo '```'
          echo
          echo '刷机与回滚见仓库 `docs/operations.md`。'
        } > release.txt

        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: NRadio C8 固件 ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        # 用自定义说明（提交清单 + 校验和），不要 GitHub 自动生成的 notes
        generate_release_notes: false
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      continue-on-error: true
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 用官方 gh 取代 dev-drprasad/delete-older-releases：该 action 最新版仍是
        # node20（被强制跑在 node24 上，有弃用警告）且属第三方依赖。语义不变：
        # 保留最新 3 个。多加一层保险：只动本 workflow 自动生成的标签
        # （YYYY.MM.DD-HHMM），手工建的 Release 一律不碰。
        set -euo pipefail
        keep=3
        gh release list --limit 100 --json tagName > releases.json
        jq -r --argjson keep "$keep" '
          map(.tagName)
          | map(select(test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}-[0-9]{4}$")))
          | sort | reverse
          | .[$keep:]
          | .[]
        ' releases.json | while read -r tag; do
          [ -n "$tag" ] || continue
          echo "删除旧 Release: $tag"
          gh release delete "$tag" --yes --cleanup-tag
        done
